name: Publish to PyPI

# Trusted Publishing(OIDC):PyPI 侧注册 pending publisher 后免长期 token。
# 注册路径:pypi.org/manage/account/publishing → owner=helloworldtang
# repo=earshot workflow=publish.yml environment=pypi project=earshot-cli
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  id-token: write  # OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
