[project]
name = "earshot"
version = "0.1.0"
description = "旁听剪藏:跨平台桌面端系统声录制 → 本地转写 → 投递知识库(默认 ExoMind,可插拔)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "sherpa-onnx>=1.13.8",
    # 上界钉死:sherpa-onnx 的 Linux wheel 链接 onnxruntime VERS_1.28.2 符号版本,
    # 1.29+ 会在 import 时报 version `VERS_1.28.2' not found(macOS 不受影响,同钉为一致)
    "onnxruntime>=1.28.0,<1.29",
    "soundcard>=0.4.3",
    "httpx>=0.27",
    # 平台 wheel 内置 ffmpeg 二进制(~60MB):系统没装 ffmpeg 也能跑(MoviePy 同款做法)
    "imageio-ffmpeg>=0.5",
    # 实时字幕:录音流 48k→16k 在线重采样(流式,不能等录完再重采样)
    "soxr>=0.5",
    # video 命令:提取B站等平台的元信息与字幕轨(纯 Python,自包含)
    "yt-dlp>=2025.1",
]

[project.scripts]
earshot = "earshot.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earshot"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# sherpa-onnx / soundcard 未随 wheel 提供 py.typed —— 与其假装,不如显式忽略
[[tool.mypy.overrides]]
module = ["sherpa_onnx.*", "soundcard.*", "onnxruntime.*", "imageio_ffmpeg.*", "soxr.*", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
